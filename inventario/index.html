<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ativo Fixo</title>

    <!-- ZXing -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f2f5;}
        header {background:#1a73e8; color:#fff; padding:15px; text-align:center;}
        nav {background:#4285f4; padding:8px;}
        nav button {margin:4px; padding:8px 16px; background:#5e9ff3; color:#fff; border:none; cursor:pointer; border-radius:4px;}
        nav button.active {background:#1a73e8; font-weight:bold;}
        .tab {display:none; padding:20px; background:#fff; margin:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
        .tab.active {display:block;}
        .form-group {margin-bottom:12px;}
        .form-group label {display:block; margin-bottom:4px; font-weight:bold;}
        .form-group input, .form-group select {width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;}
        .btn {padding:8px 16px; margin:5px 5px 5px 0; cursor:pointer; border:none; border-radius:4px;}
        .btn-primary {background:#1a73e8; color:#fff;}
        .btn-danger {background:#d32f2f; color:#fff;}
        .btn-success {background:#4caf50; color:#fff;}
        .btn-secondary {background:#9e9e9e; color:#fff;}
        table {width:100%; border-collapse:collapse; margin-top:10px;}
        th, td {border:1px solid #ddd; padding:10px; text-align:left;}
        th {background:#e3f2fd; font-weight:bold;}
        tr:hover {background:#f5f5f5; cursor:pointer;}
        tr.selected {background:#bbdefb !important;}
        #video {width:100%; max-width:400px; margin:15px 0; display:none; border:2px solid #1a73e8; border-radius:8px;}
        #inventoryList .item {padding:10px; background:#f9f9f9; margin:5px 0; border-radius:4px; cursor:pointer;}
        #inventoryList .item.selected {background:#bbdefb; border-left:4px solid #1a73e8;}
        .hidden {display:none;}
    </style>
</head>
<body>

<header><h1>Controle de Ativo Fixo</h1></header>

<nav>
    <button class="tab-btn active" data-tab="tabUnidade">Unidades</button>
    <button class="tab-btn" data-tab="tabLocais">Salas</button>
    <button class="tab-btn" data-tab="tabObjetos">Objetos</button>
    <button class="tab-btn" data-tab="tabInventario">Registrar Inventário</button>
</nav>

<!-- ====================== UNIDADES ====================== -->
<div id="tabUnidade" class="tab active">
    <h2>Cadastro de Unidades</h2>
    <div class="form-group"><label>Nome da Unidade</label><input type="text" id="unidadeNome"></div>
    <div class="form-group"><label>E-mail</label><input type="email" id="unidadeEmail"></div>
    <div class="form-group"><label>ID da Planilha (opcional)</label><input type="text" id="unidadeSheetId"></div>
    <button class="btn btn-primary" id="addUnidade">Adicionar Unidade</button>
    <button class="btn btn-danger hidden" id="removeUnidade">Remover Selecionada</button>

    <table id="tabelaUnidades">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Planilha</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<!-- ====================== SALAS ====================== -->
<div id="tabLocais" class="tab">
    <h2>Cadastro de Salas (vinculadas à Unidade)</h2>
    <div class="form-group">
        <label>Unidade</label>
        <select id="unidadeSelectLocais"><option value="">Selecione...</option></select>
    </div>
    <div class="form-group"><label>ID da Sala</label><input type="text" id="salaId"></div>
    <div class="form-group"><label>Descrição</label><input type="text" id="salaDesc"></div>
    <button class="btn btn-primary" id="addSala">Adicionar Sala</button>
    <button class="btn btn-danger hidden" id="removeSala">Remover Selecionada</button>

    <table id="tabelaSalas">
        <thead><tr><th>Unidade</th><th>ID</th><th>Descrição</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<!-- ====================== OBJETOS ====================== -->
<div id="tabObjetos" class="tab">
    <h2>Cadastro de Tipos de Objetos</h2>
    <div class="form-group"><label>ID do Objeto</label><input type="text" id="objId"></div>
    <div class="form-group"><label>Descrição</label><input type="text" id="objDesc"></div>
    <div class="form-group"><label>Complemento</label><input type="text" id="objComp"></div>
    <button class="btn btn-primary" id="addObjeto">Adicionar Objeto</button>
    <button class="btn btn-danger hidden" id="removeObjeto">Remover Selecionado</button>

    <table id="tabelaObjetos">
        <thead><tr><th>ID</th><th>Descrição</th><th>Complemento</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<!-- ====================== INVENTÁRIO ====================== -->
<div id="tabInventario" class="tab">
    <h2>Registrar Inventário</h2>

    <div class="form-group">
        <label>Unidade</label>
        <select id="selectUnidadeInv"><option value="">Selecione...</option></select>
    </div>

    <div class="form-group">
        <label>Sala</label>
        <select id="selectSala"><option value="">Selecione...</option></select>
    </div>

    <div class="form-group">
        <label>Tipo de Objeto</label>
        <select id="selectObjeto"><option value="">Selecione...</option></select>
    </div>

    <div class="form-group">
        <label>Código de Barras</label>
        <input type="text" id="barcodeInput" placeholder="Digite ou escaneie">
        <button class="btn btn-primary" id="scanBtn">Escanear</button>
    </div>

    <div class="form-group">
        <label>Modo</label>
        <label><input type="radio" name="scanMode" value="single" checked> Única</label>
        <label><input type="radio" name="scanMode" value="loop"> Loop</label>
    </div>

    <video id="video" autoplay playsinline></video>

    <hr>
    <button class="btn btn-primary" id="addItemBtn">Adicionar</button>
    <button class="btn btn-danger" id="removeItemBtn" disabled>Remover</button>
    <button class="btn btn-secondary" id="clearSalaBtn">Limpar Sala</button>

    <h3>Itens registrados</h3>
    <div id="inventoryList"></div>

    <hr>
    <button class="btn btn-success" id="downloadXlsxBtn">Gerar Relatório XLSX (com estilo)</button>
</div>

<script>
/* ==============================================================
   DADOS GLOBAIS
   ============================================================== */
const codeReader = new ZXing.BrowserMultiFormatReader();
let scanning = false;
let selectedItemIndex = -1;
let selectedUnidadeIndex = -1;
let selectedSalaIndex = -1;
let selectedObjetoIndex = -1;

let data = {
    unidades: [],      // [{id, nome, email, sheetId}]
    salas: [],         // [{id, unidadeId, descricao}]
    objetos: [],       // [{id, descricao, complemento}]
    inventario: []     // [{unidadeId, salaId, objetoId, codigoBarra, contador, dataHora}]
};

/* ==============================================================
   PERSISTÊNCIA
   ============================================================== */
function loadData() {
    const stored = localStorage.getItem('ativoFixoDataV2');
    if (stored) data = JSON.parse(stored);
    else saveData();
}
function saveData() {
    localStorage.setItem('ativoFixoDataV2', JSON.stringify(data));
}

/* ==============================================================
   NAVEGAÇÃO
   ============================================================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        btn.classList.add('active');

        if (btn.dataset.tab === 'tabUnidade') renderUnidades();
        if (btn.dataset.tab === 'tabLocais') { renderUnidadeSelectLocais(); renderSalas(); }
        if (btn.dataset.tab === 'tabObjetos') renderObjetos();
        if (btn.dataset.tab === 'tabInventario') initInventarioTab();
    });
});

/* ==============================================================
   UNIDADES
   ============================================================== */
function renderUnidades() {
    const tbody = document.querySelector('#tabelaUnidades tbody');
    tbody.innerHTML = '';
    data.unidades.forEach((u, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.nome}</td><td>${u.email}</td><td>${u.sheetId || '-'}</td>`;
        tr.onclick = () => {
            document.querySelectorAll('#tabelaUnidades tr').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');
            selectedUnidadeIndex = i;
            document.getElementById('removeUnidade').classList.remove('hidden');
            preencheUnidade(u);
        };
        tbody.appendChild(tr);
    });
}

function preencheUnidade(u) {
    document.getElementById('unidadeNome').value = u.nome;
    document.getElementById('unidadeEmail').value = u.email;
    document.getElementById('unidadeSheetId').value = u.sheetId || '';
}

document.getElementById('addUnidade').addEventListener('click', () => {
    const nome = document.getElementById('unidadeNome').value.trim();
    const email = document.getElementById('unidadeEmail').value.trim();
    if (!nome) return alert('Nome é obrigatório');

    if (selectedUnidadeIndex >= 0) {
        data.unidades[selectedUnidadeIndex].nome = nome;
        data.unidades[selectedUnidadeIndex].email = email;
        data.unidades[selectedUnidadeIndex].sheetId = document.getElementById('unidadeSheetId').value.trim();
        selectedUnidadeIndex = -1;
        document.getElementById('removeUnidade').classList.add('hidden');
    } else {
        const id = 'u' + Date.now();
        data.unidades.push({id, nome, email, sheetId: document.getElementById('unidadeSheetId').value.trim()});
    }
    limpaUnidade(); saveData(); renderUnidades();
});

document.getElementById('removeUnidade').addEventListener('click', () => {
    if (selectedUnidadeIndex >= 0 && confirm('Remover unidade?')) {
        data.unidades.splice(selectedUnidadeIndex, 1);
        selectedUnidadeIndex = -1;
        document.getElementById('removeUnidade').classList.add('hidden');
        limpaUnidade(); saveData(); renderUnidades();
    }
});

function limpaUnidade() {
    document.getElementById('unidadeNome').value = '';
    document.getElementById('unidadeEmail').value = '';
    document.getElementById('unidadeSheetId').value = '';
}

/* ==============================================================
   SALAS
   ============================================================== */
function renderUnidadeSelectLocais() {
    const select = document.getElementById('unidadeSelectLocais');
    select.innerHTML = '<option value="">Selecione...</option>';
    data.unidades.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id; opt.textContent = u.nome;
        select.appendChild(opt);
    });
}

function renderSalas() {
    const tbody = document.querySelector('#tabelaSalas tbody');
    tbody.innerHTML = '';
    const unidadeId = document.getElementById('unidadeSelectLocais').value;
    const salas = unidadeId ? data.salas.filter(s => s.unidadeId === unidadeId) : data.salas;

    salas.forEach((s, i) => {
        const u = data.unidades.find(un => un.id === s.unidadeId);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u?.nome || '—'}</td><td>${s.id}</td><td>${s.descricao}</td>`;
        tr.onclick = () => {
            document.querySelectorAll('#tabelaSalas tr').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');
            selectedSalaIndex = data.salas.indexOf(s);
            document.getElementById('removeSala').classList.remove('hidden');
            document.getElementById('salaId').value = s.id;
            document.getElementById('salaDesc').value = s.descricao;
            document.getElementById('unidadeSelectLocais').value = s.unidadeId;
        };
        tbody.appendChild(tr);
    });
}

document.getElementById('addSala').addEventListener('click', () => {
    const unidadeId = document.getElementById('unidadeSelectLocais').value;
    const id = document.getElementById('salaId').value.trim();
    const desc = document.getElementById('salaDesc').value.trim();
    if (!unidadeId || !id || !desc) return alert('Preencha todos os campos');

    if (selectedSalaIndex >= 0) {
        data.salas[selectedSalaIndex].id = id;
        data.salas[selectedSalaIndex].descricao = desc;
        selectedSalaIndex = -1;
        document.getElementById('removeSala').classList.add('hidden');
    } else {
        data.salas.push({id, unidadeId, descricao: desc});
    }
    limpaSala(); saveData(); renderSalas();
});

document.getElementById('removeSala').addEventListener('click', () => {
    if (selectedSalaIndex >= 0 && confirm('Remover sala?')) {
        data.salas.splice(selectedSalaIndex, 1);
        selectedSalaIndex = -1;
        document.getElementById('removeSala').classList.add('hidden');
        limpaSala(); saveData(); renderSalas();
    }
});

function limpaSala() {
    document.getElementById('salaId').value = '';
    document.getElementById('salaDesc').value = '';
}

/* ==============================================================
   OBJETOS
   ============================================================== */
function renderObjetos() {
    const tbody = document.querySelector('#tabelaObjetos tbody');
    tbody.innerHTML = '';
    data.objetos.forEach((o, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${o.id}</td><td>${o.descricao}</td><td>${o.complemento || ''}</td>`;
        tr.onclick = () => {
            document.querySelectorAll('#tabelaObjetos tr').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');
            selectedObjetoIndex = i;
            document.getElementById('removeObjeto').classList.remove('hidden');
            document.getElementById('objId').value = o.id;
            document.getElementById('objDesc').value = o.descricao;
            document.getElementById('objComp').value = o.complemento || '';
        };
        tbody.appendChild(tr);
    });
}

document.getElementById('addObjeto').addEventListener('click', () => {
    const id = document.getElementById('objId').value.trim();
    const desc = document.getElementById('objDesc').value.trim();
    const comp = document.getElementById('objComp').value.trim();
    if (!id || !desc) return alert('Preencha ID e descrição');

    if (selectedObjetoIndex >= 0) {
        data.objetos[selectedObjetoIndex].id = id;
        data.objetos[selectedObjetoIndex].descricao = desc;
        data.objetos[selectedObjetoIndex].complemento = comp;
        selectedObjetoIndex = -1;
        document.getElementById('removeObjeto').classList.add('hidden');
    } else {
        data.objetos.push({id, descricao: desc, complemento: comp});
    }
    limpaObjeto(); saveData(); renderObjetos();
});

document.getElementById('removeObjeto').addEventListener('click', () => {
    if (selectedObjetoIndex >= 0 && confirm('Remover objeto?')) {
        data.objetos.splice(selectedObjetoIndex, 1);
        selectedObjetoIndex = -1;
        document.getElementById('removeObjeto').classList.add('hidden');
        limpaObjeto(); saveData(); renderObjetos();
    }
});

function limpaObjeto() {
    document.getElementById('objId').value = '';
    document.getElementById('objDesc').value = '';
    document.getElementById('objComp').value = '';
}

/* ==============================================================
   INVENTÁRIO
   ============================================================== */
function initInventarioTab() {
    const selUnidade = document.getElementById('selectUnidadeInv');
    const selSala = document.getElementById('selectSala');
    const selObj = document.getElementById('selectObjeto');

    selUnidade.innerHTML = '<option value="">Selecione...</option>';
    data.unidades.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id; opt.textContent = u.nome;
        selUnidade.appendChild(opt);
    });

    selUnidade.addEventListener('change', () => {
        const unidadeId = selUnidade.value;
        selSala.innerHTML = '<option value="">Selecione...</option>';
        if (unidadeId) {
            data.salas.filter(s => s.unidadeId === unidadeId).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id; opt.textContent = s.descricao;
                selSala.appendChild(opt);
            });
        }
        renderInventoryList();
    });

    selSala.addEventListener('change', renderInventoryList);

    selObj.innerHTML = '<option value="">Selecione...</option>';
    data.objetos.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id; opt.textContent = o.descricao;
        selObj.appendChild(opt);
    });
}

/* ==============================================================
   SCANNER
   ============================================================== */
document.getElementById('scanBtn').addEventListener('click', () => {
    const mode = document.querySelector('input[name="scanMode"]:checked').value;
    if (scanning) { codeReader.reset(); scanning = false; document.getElementById('video').style.display = 'none'; return; }
    scanning = true;
    const video = document.getElementById('video');
    video.style.display = 'block';
    codeReader.decodeFromVideoDevice(undefined, video, (result) => {
        if (result) {
            document.getElementById('barcodeInput').value = result.getText();
            if (mode === 'single') stopScanner();
        }
    });
});
function stopScanner() { codeReader.reset(); scanning = false; document.getElementById('video').style.display = 'none'; }

/* ==============================================================
   ADICIONAR ITEM
   ============================================================== */
document.getElementById('addItemBtn').addEventListener('click', addInventoryItem);
document.getElementById('barcodeInput').addEventListener('keypress', e => { if (e.key === 'Enter') addInventoryItem(); });

function addInventoryItem() {
    const unidadeId = document.getElementById('selectUnidadeInv').value;
    const salaId = document.getElementById('selectSala').value;
    const objId = document.getElementById('selectObjeto').value;
    const codigo = document.getElementById('barcodeInput').value.trim();

    if (!unidadeId || !salaId || !objId || !codigo) return alert('Preencha todos os campos');

    const key = `${unidadeId}-${salaId}-${objId}-${codigo}`;
    const existente = data.inventario.find(i => i.unidadeId === unidadeId && i.salaId === salaId && i.objetoId === objId && i.codigoBarra === codigo);

    if (existente) {
        existente.contador++;
    } else {
        const now = new Date().toISOString().slice(0,19).replace('T',' ');
        data.inventario.push({unidadeId, salaId, objetoId: objId, codigoBarra: codigo, contador: 1, dataHora: now});
    }

    saveData(); renderInventoryList(); document.getElementById('barcodeInput').value = '';
    if (document.querySelector('input[name="scanMode"]:checked').value !== 'loop') stopScanner();
}

function renderInventoryList() {
    const unidadeId = document.getElementById('selectUnidadeInv').value;
    const salaId = document.getElementById('selectSala').value;
    const list = document.getElementById('inventoryList');
    list.innerHTML = '';

    if (!unidadeId || !salaId) return;

    const itens = data.inventario.filter(i => i.unidadeId === unidadeId && i.salaId === salaId);
    if (itens.length === 0) {
        list.innerHTML = '<i>Nenhum item registrado.</i>';
        return;
    }

    itens.forEach((item, idx) => {
        const obj = data.objetos.find(o => o.id === item.objetoId);
        const div = document.createElement('div');
        div.className = 'item';
        div.textContent = `${item.codigoBarra} – ${obj?.descricao || item.objetoId} (x${item.contador})`;
        div.onclick = () => {
            document.querySelectorAll('.item').forEach(e => e.classList.remove('selected'));
            div.classList.add('selected');
            selectedItemIndex = data.inventario.indexOf(item);
            document.getElementById('removeItemBtn').disabled = false;
            document.getElementById('barcodeInput').value = item.codigoBarra;
        };
        list.appendChild(div);
    });
}

document.getElementById('removeItemBtn').addEventListener('click', () => {
    if (selectedItemIndex >= 0) {
        const item = data.inventario[selectedItemIndex];
        if (item.contador > 1 && !confirm(`Contador = ${item.contador}. Remover?`)) return;
        data.inventario.splice(selectedItemIndex, 1);
        saveData(); renderInventoryList(); selectedItemIndex = -1; document.getElementById('removeItemBtn').disabled = true;
    }
});

document.getElementById('clearSalaBtn').addEventListener('click', () => {
    const unidadeId = document.getElementById('selectUnidadeInv').value;
    const salaId = document.getElementById('selectSala').value;
    if (!unidadeId || !salaId) return;
    if (confirm('Limpar TODOS os itens desta sala?')) {
        data.inventario = data.inventario.filter(i => !(i.unidadeId === unidadeId && i.salaId === salaId));
        saveData(); renderInventoryList();
    }
});

/* ==============================================================
   GERAR XLSX COM ESTILO
   ============================================================== */
document.getElementById('downloadXlsxBtn').addEventListener('click', gerarXlsxEstilizado);

function gerarXlsxEstilizado() {
    const wb = XLSX.utils.book_new();

    // Estilos
    const headerStyle = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A73E8" } }, alignment: { horizontal: "center" } };
    const cellStyle = { border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } } };

    // === Unidade ===
    const unidadeRows = [['Nome', 'E-mail', 'Planilha ID']];
    data.unidades.forEach(u => unidadeRows.push([u.nome, u.email, u.sheetId || '']));
    const wsUnidade = XLSX.utils.aoa_to_sheet(unidadeRows);
    applyStyle(wsUnidade, 'A1:C1', headerStyle);
    applyBorders(wsUnidade, `A1:C${unidadeRows.length}`);
    autoWidth(wsUnidade, unidadeRows);
    XLSX.utils.book_append_sheet(wb, wsUnidade, 'Unidades');

    // === Salas ===
    const salaRows = [['Unidade', 'ID Sala', 'Descrição']];
    data.salas.forEach(s => {
        const u = data.unidades.find(un => un.id === s.unidadeId);
        salaRows.push([u?.nome || '', s.id, s.descricao]);
    });
    const wsSalas = XLSX.utils.aoa_to_sheet(salaRows);
    applyStyle(wsSalas, 'A1:C1', headerStyle);
    applyBorders(wsSalas, `A1:C${salaRows.length}`);
    autoWidth(wsSalas, salaRows);
    XLSX.utils.book_append_sheet(wb, wsSalas, 'Salas');

    // === Objetos ===
    const objRows = [['ID', 'Descrição', 'Complemento']];
    data.objetos.forEach(o => objRows.push([o.id, o.descricao, o.complemento || '']));
    const wsObjetos = XLSX.utils.aoa_to_sheet(objRows);
    applyStyle(wsObjetos, 'A1:C1', headerStyle);
    applyBorders(wsObjetos, `A1:C${objRows.length}`);
    autoWidth(wsObjetos, objRows);
    XLSX.utils.book_append_sheet(wb, wsObjetos, 'Objetos');

    // === Inventário ===
    const invRows = [['Unidade', 'Sala', 'Objeto', 'Código', 'Contador', 'Data/Hora']];
    data.inventario.forEach(i => {
        const u = data.unidades.find(un => un.id === i.unidadeId)?.nome || '';
        const s = data.salas.find(sa => sa.id === i.salaId)?.descricao || '';
        const o = data.objetos.find(ob => ob.id === i.objetoId)?.descricao || '';
        invRows.push([u, s, o, i.codigoBarra, i.contador, i.dataHora]);
    });
    const wsInv = XLSX.utils.aoa_to_sheet(invRows);
    applyStyle(wsInv, 'A1:F1', headerStyle);
    applyBorders(wsInv, `A1:F${invRows.length}`);
    autoWidth(wsInv, invRows);
    XLSX.utils.book_append_sheet(wb, wsInv, 'Inventário');

    // === Relatório ===
    const relRows = [['UNIDADE', 'SALA', 'OBJETO', 'CÓDIGO', 'QTD', 'DATA/HORA']];
    data.inventario.forEach(i => {
        const u = data.unidades.find(un => un.id === i.unidadeId)?.nome || '';
        const s = data.salas.find(sa => sa.id === i.salaId)?.descricao || '';
        const o = data.objetos.find(ob => ob.id === i.objetoId)?.descricao || '';
        relRows.push([u, s, o, i.codigoBarra, i.contador, i.dataHora]);
    });
    const wsRel = XLSX.utils.aoa_to_sheet(relRows);
    applyStyle(wsRel, 'A1:F1', headerStyle);
    applyBorders(wsRel, `A1:F${relRows.length}`);
    autoWidth(wsRel, relRows);
    XLSX.utils.book_append_sheet(wb, wsRel, 'Relatório');

    const fileName = `Inventario_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fileName);
}

function applyStyle(ws, range, style) {
    const ref = XLSX.utils.decode_range(range);
    for (let r = ref.s.r; r <= ref.e.r; ++r) {
        for (let c = ref.s.c; c <= ref.e.c; ++c) {
            const cell = ws[XLSX.utils.encode_cell({r, c})];
            if (cell) cell.s = style;
        }
    }
}

function applyBorders(ws, range) {
    const ref = XLSX.utils.decode_range(range);
    for (let r = ref.s.r; r <= ref.e.r; ++r) {
        for (let c = ref.s.c; c <= ref.e.c; ++c) {
            const cell = ws[XLSX.utils.encode_cell({r, c})];
            if (!cell.s) cell.s = {};
            cell.s.border = { top: {style:"thin"}, bottom:{style:"thin"}, left:{style:"thin"}, right:{style:"thin"} };
        }
    }
}

function autoWidth(ws, data) {
    const colWidths = data[0].map((_, i) => ({wch: 10}));
    data.forEach(row => {
        row.forEach((val, j) => {
            const len = val ? val.toString().length : 10;
            if (colWidths[j].wch < len) colWidths[j].wch = len + 2;
        });
    });
    ws['!cols'] = colWidths;
}
