<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ativo Fixo</title>

    <!-- ZXing (leitor de código de barras) -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js?v=1.0.3"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js?v=1.0.3"></script>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?v=1.0.3"></script>

    <style>
        :root {
            --primary: #1a73e8;
            --success: #4caf50;
            --danger: #d32f2f;
            --gray: #9e9e9e;
            --light: #f8f9fa;
            --dark: #212529;
        }
        body {
            font-family:'Segoe UI',sans-serif;margin:0;padding:0;padding-top:50px;padding-bottom:60px;background:#f0f2f5;
        }
        header {background:#1a73e8;color:#fff;padding:10px 15px;text-align:center;position:fixed;top:0;width:100%;z-index:1000;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        header h1 {font-size:1.5rem;margin:0;}
        
        nav {background:#4285f4;padding:8px;display:flex;overflow-x:auto;position:fixed;bottom:0;width:100%;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.3);}
        nav button {margin:4px;padding:8px 16px;background:#5e9ff3;color:#fff;border:none;cursor:pointer;border-radius:4px;white-space:nowrap;flex-shrink:0;}
        nav button.active {background:var(--primary);font-weight:bold;}
        
        .tab {display:none;padding:20px;background:#fff;margin:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
        .tab.active {display:block;}

        .form-group {margin-bottom:12px;}
        .form-group label {display:block;margin-bottom:4px;font-weight:bold;color:var(--dark);}
        .form-group input,.form-group select {width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;}
        .btn {padding:8px 16px;margin:2px;cursor:pointer;border:none;border-radius:4px;font-weight:bold;font-size:14px;}
        .btn-primary {background:var(--primary);color:#fff;}
        .btn-success {background:var(--success);color:#fff;}
        .btn-danger {background:var(--danger);color:#fff;}
        .btn-secondary {background:var(--gray);color:#fff;}
        .table-wrapper {overflow-x:auto;width:100%;}
        table {width:100%;border-collapse:collapse;margin-top:10px;}
        th, td {border:1px solid #ddd;padding:10px;text-align:left;word-break:break-word;}
        th {background:#e3f2fd;font-weight:bold;}
        tr:hover {background:#f5f5f5;}
        .scan-frame {position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
    </style>
</head>
<body>

<header>
    <h1>📦 Controle de Ativo Fixo</h1>
</header>

<!-- Abas de navegação -->
<nav>
    <button onclick="showTab(0)" class="tab-btn active">Início</button>
    <button onclick="showTab(1)" class="tab-btn">Cadastrar Sala</button>
    <button onclick="showTab(2)" class="tab-btn">Cadastrar Objeto</button>
    <button onclick="showTab(3)" class="tab-btn">Inventário</button>
    <button onclick="showTab(4)" class="tab-btn">Scanner</button>
</nav>

<!-- Conteúdo das abas (simplificado + campos com geração automática) -->
<div id="tab0" class="tab active">Bem-vindo ao sistema de inventário!</div>

<!-- ==================== ABA CADASTRAR SALA ==================== -->
<div id="tab1" class="tab">
    <h2 class="text-xl font-bold mb-4">Cadastrar Nova Sala</h2>
    <div class="form-group">
        <label>Código da Sala</label>
        <div class="flex gap-2">
            <input type="text" id="sala_codigo" placeholder="SL001" readonly class="flex-1">
            <button type="button" onclick="gerarCodigoSala()" class="btn btn-primary">🔄 Gerar SL</button>
        </div>
    </div>
    <div class="form-group">
        <label>Nome da Sala</label>
        <input type="text" id="sala_nome" placeholder="Ex: Sala de TI">
    </div>
    <button onclick="cadastrarSala()" class="btn btn-success w-full">Salvar Sala</button>
</div>

<!-- ==================== ABA CADASTRAR OBJETO ==================== -->
<div id="tab2" class="tab">
    <h2 class="text-xl font-bold mb-4">Cadastrar Novo Objeto</h2>
    <div class="form-group">
        <label>Código do Objeto</label>
        <div class="flex gap-2">
            <input type="text" id="objeto_codigo" placeholder="OB0001" readonly class="flex-1">
            <button type="button" onclick="gerarCodigoObjeto()" class="btn btn-primary">🔄 Gerar OB</button>
        </div>
    </div>
    <div class="form-group">
        <label>Descrição do Objeto</label>
        <input type="text" id="objeto_descricao" placeholder="Ex: Computador Dell">
    </div>
    <div class="form-group">
        <label>Sala</label>
        <select id="objeto_sala"></select>
    </div>
    <button onclick="cadastrarObjeto()" class="btn btn-success w-full">Salvar Objeto</button>
</div>

<!-- ==================== OUTRAS ABAS (mantidas simplificadas) ==================== -->
<div id="tab3" class="tab">Lista de Inventário (em desenvolvimento)</div>
<div id="tab4" class="tab">Scanner de Código de Barras (em desenvolvimento)</div>

<script>
// ==================== FUNÇÕES DE GERAÇÃO AUTOMÁTICA ====================

function gerarProximoCodigoSala() {
    let salas = JSON.parse(localStorage.getItem('salas')) || [];
    if (salas.length === 0) return 'SL001';

    let max = 0;
    salas.forEach(s => {
        if (s.codigo && s.codigo.startsWith('SL')) {
            const num = parseInt(s.codigo.slice(2));
            if (!isNaN(num)) max = Math.max(max, num);
        }
    });
    const proximo = max + 1;
    if (proximo > 999) {
        alert('❌ Limite máximo de salas atingido (SL999)');
        return null;
    }
    return 'SL' + String(proximo).padStart(3, '0');
}

function gerarProximoCodigoObjeto() {
    let objetos = JSON.parse(localStorage.getItem('objetos')) || [];
    if (objetos.length === 0) return 'OB0001';

    let max = 0;
    objetos.forEach(o => {
        if (o.codigo && o.codigo.startsWith('OB')) {
            const num = parseInt(o.codigo.slice(2));
            if (!isNaN(num)) max = Math.max(max, num);
        }
    });
    const proximo = max + 1;
    if (proximo > 9999) {
        alert('❌ Limite máximo de objetos atingido (OB9999)');
        return null;
    }
    return 'OB' + String(proximo).padStart(4, '0');
}

// Botões de geração
function gerarCodigoSala() {
    const codigo = gerarProximoCodigoSala();
    if (codigo) document.getElementById('sala_codigo').value = codigo;
}

function gerarCodigoObjeto() {
    const codigo = gerarProximoCodigoObjeto();
    if (codigo) document.getElementById('objeto_codigo').value = codigo;
}

// ==================== FUNÇÕES DE CADASTRO (exemplo básico) ====================

function cadastrarSala() {
    const codigo = document.getElementById('sala_codigo').value.trim();
    const nome = document.getElementById('sala_nome').value.trim();

    if (!codigo || !nome) {
        alert('Preencha o código e o nome da sala');
        return;
    }

    let salas = JSON.parse(localStorage.getItem('salas')) || [];
    salas.push({ codigo, nome, data: new Date().toISOString() });
    localStorage.setItem('salas', JSON.stringify(salas));

    alert(`✅ Sala ${codigo} cadastrada com sucesso!`);
    document.getElementById('sala_codigo').value = '';
    document.getElementById('sala_nome').value = '';
    carregarSalasNoSelect(); // atualiza select de salas
}

function cadastrarObjeto() {
    const codigo = document.getElementById('objeto_codigo').value.trim();
    const descricao = document.getElementById('objeto_descricao').value.trim();
    const sala = document.getElementById('objeto_sala').value;

    if (!codigo || !descricao || !sala) {
        alert('Preencha todos os campos do objeto');
        return;
    }

    let objetos = JSON.parse(localStorage.getItem('objetos')) || [];
    objetos.push({ codigo, descricao, sala, data: new Date().toISOString() });
    localStorage.setItem('objetos', JSON.stringify(objetos));

    alert(`✅ Objeto ${codigo} cadastrado com sucesso!`);
    document.getElementById('objeto_codigo').value = '';
    document.getElementById('objeto_descricao').value = '';
}

// Carrega salas no select de objetos
function carregarSalasNoSelect() {
    const select = document.getElementById('objeto_sala');
    select.innerHTML = '<option value="">Selecione uma sala</option>';
    const salas = JSON.parse(localStorage.getItem('salas')) || [];
    salas.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.codigo;
        opt.textContent = `${s.codigo} - ${s.nome}`;
        select.appendChild(opt);
    });
}

// Troca de abas
function showTab(n) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById('tab' + n).classList.add('active');

    document.querySelectorAll('nav button').forEach((btn, i) => {
        btn.classList.toggle('active', i === n);
    });

    if (n === 2) carregarSalasNoSelect(); // ao abrir aba de objeto
}

// Inicialização
window.onload = () => {
    showTab(0);
    carregarSalasNoSelect();
};
</script>

</body>
</html>
