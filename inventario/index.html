<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ativo Fixo</title>

    <!-- ZXing (leitor de código de barras) -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5;}
        header {background:#3f51b5; color:#fff; padding:15px; text-align:center;}
        nav {background:#5c6bc0; padding:10px;}
        nav button {margin:5px; padding:8px 12px; background:#7986cb; color:#fff; border:none; cursor:pointer;}
        nav button.active {background:#3f51b5;}
        .tab {display:none; padding:20px; background:#fff; margin:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.1);}
        .tab.active {display:block;}
        .form-group {margin-bottom:12px;}
        .form-group label {display:block; margin-bottom:4px;}
        .form-group input, .form-group select {width:100%; padding:6px; box-sizing:border-box;}
        .btn {padding:6px 12px; margin-right:5px; cursor:pointer;}
        .btn-primary {background:#3f51b5; color:#fff;}
        .btn-danger {background:#d32f2f; color:#fff;}
        #video {width:100%; max-width:400px; margin-top:10px; display:none;}
        #inventoryList {margin-top:15px;}
        .item {padding:8px; background:#eee; margin-bottom:5px; cursor:pointer; border-radius:4px;}
        .item.selected {background:#c5cae9;}
    </style>
</head>
<body>

<header><h1>Controle de Ativo Fixo</h1></header>

<nav>
    <button class="tab-btn" data-tab="tabUnidade">Unidade</button>
    <button class="tab-btn" data-tab="tabLocais">Salas</button>
    <button class="tab-btn" data-tab="tabObjetos">Objetos</button>
    <button class="tab-btn" data-tab="tabInventario">Registrar Inventário</button>
</nav>

<!-- ====================== UNIDADE ====================== -->
<div id="tabUnidade" class="tab">
    <h2>Unidade / Filial</h2>
    <div class="form-group">
        <label>Nome</label>
        <input type="text" id="unidadeNome">
    </div>
    <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="unidadeEmail">
    </div>
    <div class="form-group">
        <label>Spreadsheet ID (do Google Sheets)</label>
        <input type="text" id="unidadeSpreadsheetId" placeholder="Ex: 1a2b3c4d5e6f7g8h9i0j">
    </div>
    <div class="form-group">
        <label>API Key (Google Cloud)</label>
        <input type="text" id="unidadeApiKey">
    </div>
    <div class="form-group">
        <label>Nome da Aba (Sheet Name)</label>
        <input type="text" id="unidadeSheetName" value="Sheet1">
    </div>
    <button class="btn btn-primary" id="salvarUnidade">Salvar Unidade</button>
</div>

<!-- ====================== SALAS ====================== -->
<div id="tabLocais" class="tab">
    <h2>Cadastro de Salas</h2>
    <div class="form-group">
        <label>ID da Sala</label>
        <input type="text" id="salaId">
    </div>
    <div class="form-group">
        <label>Descrição</label>
        <input type="text" id="salaDesc">
    </div>
    <button class="btn btn-primary" id="addSala">Adicionar Sala</button>
    <ul id="listaSalas"></ul>
</div>

<!-- ====================== OBJETOS ====================== -->
<div id="tabObjetos" class="tab">
    <h2>Cadastro de Tipos de Objetos</h2>
    <div class="form-group">
        <label>ID do Objeto</label>
        <input type="text" id="objId">
    </div>
    <div class="form-group">
        <label>Descrição</label>
        <input type="text" id="objDesc">
    </div>
    <div class="form-group">
        <label>Complemento (opcional)</label>
        <input type="text" id="objComp">
    </div>
    <button class="btn btn-primary" id="addObjeto">Adicionar Objeto</button>
    <ul id="listaObjetos"></ul>
</div>

<!-- ====================== INVENTÁRIO ====================== -->
<div id="tabInventario" class="tab">
    <h2>Registrar Inventário</h2>

    <div class="form-group">
        <label>Local (Sala)</label>
        <select id="selectSala"><option value="">Selecione...</option></select>
    </div>

    <div class="form-group">
        <label>Tipo de Objeto</label>
        <select id="selectObjeto"><option value="">Selecione...</option></select>
    </div>

    <div class="form-group">
        <label>Código de Barras</label>
        <input type="text" id="barcodeInput" placeholder="Digite ou escaneie">
        <button class="btn btn-primary" id="scanBtn">Escanear</button>
    </div>

    <div class="form-group">
        <label>Modo de captura</label>
        <label><input type="radio" name="scanMode" value="single" checked> Única</label>
        <label><input type="radio" name="scanMode" value="loop"> Loop</label>
    </div>

    <video id="video" autoplay playsinline></video>

    <hr>
    <button class="btn btn-primary" id="addItemBtn">Adicionar</button>
    <button class="btn btn-danger" id="removeItemBtn" disabled>Remover Selecionado</button>
    <button class="btn" id="clearSalaBtn">Limpar Sala</button>

    <h3>Itens registrados nesta sala</h3>
    <div id="inventoryList"></div>

    <hr>
    <button class="btn btn-primary" id="sendToSheetBtn">Enviar para Google Sheets</button>
</div>

<script>
/* ==============================================================
   VARIÁVEIS GLOBAIS
   ============================================================== */
const codeReader = new ZXing.BrowserMultiFormatReader();
let scanning = false;
let selectedItemIndex = -1;   // índice do item selecionado na lista
let data = {
    inventário: [{
        unidade: {nome:"", email:"", status:"aberto", ano:"2025", mes:"10", urlPlanilha:""},
        locais: [],
        objetos: [],
        inventario: []           // array de salas com objetos
    }]
};

/* ==============================================================
   FUNÇÕES DE PERSISTÊNCIA
   ============================================================== */
function loadData() {
    const stored = localStorage.getItem('ativoFixoData');
    if (stored) data = JSON.parse(stored);
    else saveData(); // cria estrutura inicial
}
function saveData() {
    localStorage.setItem('ativoFixoData', JSON.stringify(data));
}

/* ==============================================================
   NAVEGAÇÃO ENTRE ABAS
   ============================================================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        btn.classList.add('active');

        // recarrega listas ao abrir aba
        if (btn.dataset.tab === 'tabLocais') renderSalas();
        if (btn.dataset.tab === 'tabObjetos') renderObjetos();
        if (btn.dataset.tab === 'tabInventario') initInventarioTab();
    });
});

/* ==============================================================
   UNIDADE
   ============================================================== */
document.getElementById('salvarUnidade').addEventListener('click', () => {
    const u = data.inventário[0].unidade;
    u.nome = document.getElementById('unidadeNome').value.trim();
    u.email = document.getElementById('unidadeEmail').value.trim();
    u.spreadsheetId = document.getElementById('unidadeSpreadsheetId').value.trim();
    u.apiKey = document.getElementById('unidadeApiKey').value.trim();
    u.sheetName = document.getElementById('unidadeSheetName').value.trim();
    saveData();
    alert('Unidade salva!');
});

/* ==============================================================
   SALAS
   ============================================================== */
function renderSalas() {
    const ul = document.getElementById('listaSalas');
    ul.innerHTML = '';
    data.inventário[0].locais.forEach((s, i) => {
        const li = document.createElement('li');
        li.textContent = `${s.id} – ${s.descricao}`;
        const del = document.createElement('button');
        del.textContent = 'X';
        del.className = 'btn btn-danger';
        del.style.float = 'right';
        del.onclick = () => {
            if (confirm('Remover sala?')) {
                data.inventário[0].locais.splice(i,1);
                saveData(); renderSalas();
            }
        };
        li.appendChild(del);
        ul.appendChild(li);
    });
}
document.getElementById('addSala').addEventListener('click', () => {
    const id = document.getElementById('salaId').value.trim();
    const desc = document.getElementById('salaDesc').value.trim();
    if (!id || !desc) return alert('Preencha ID e descrição');
    if (data.inventário[0].locais.some(l => l.id===id)) return alert('ID já existe');
    data.inventário[0].locais.push({id, descricao:desc, quantidade:0});
    saveData(); renderSalas();
    document.getElementById('salaId').value = '';
    document.getElementById('salaDesc').value = '';
});

/* ==============================================================
   OBJETOS
   ============================================================== */
function renderObjetos() {
    const ul = document.getElementById('listaObjetos');
    ul.innerHTML = '';
    data.inventário[0].objetos.forEach((o, i) => {
        const li = document.createElement('li');
        li.textContent = `${o.id} – ${o.descricao}`;
        const del = document.createElement('button');
        del.textContent = 'X';
        del.className = 'btn btn-danger';
        del.style.float = 'right';
        del.onclick = () => {
            if (confirm('Remover objeto?')) {
                data.inventário[0].objetos.splice(i,1);
                saveData(); renderObjetos();
            }
        };
        li.appendChild(del);
        ul.appendChild(li);
    });
}
document.getElementById('addObjeto').addEventListener('click', () => {
    const id = document.getElementById('objId').value.trim();
    const desc = document.getElementById('objDesc').value.trim();
    const comp = document.getElementById('objComp').value.trim();
    if (!id || !desc) return alert('Preencha ID e descrição');
    if (data.inventário[0].objetos.some(o => o.id===id)) return alert('ID já existe');
    data.inventário[0].objetos.push({id, descricao:desc, complemento:comp});
    saveData(); renderObjetos();
    document.getElementById('objId').value = '';
    document.getElementById('objDesc').value = '';
    document.getElementById('objComp').value = '';
});

/* ==============================================================
   INVENTÁRIO – INICIALIZAÇÃO
   ============================================================== */
function initInventarioTab() {
    // preenche selects
    const selSala = document.getElementById('selectSala');
    const selObj = document.getElementById('selectObjeto');
    selSala.innerHTML = '<option value="">Selecione...</option>';
    selObj.innerHTML = '<option value="">Selecione...</option>';

    data.inventário[0].locais.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id; opt.textContent = l.descricao;
        selSala.appendChild(opt);
    });
    data.inventário[0].objetos.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id; opt.textContent = o.descricao;
        selObj.appendChild(opt);
    });

    // ao mudar sala, recarrega lista
    selSala.addEventListener('change', () => {
        selectedItemIndex = -1;
        document.getElementById('removeItemBtn').disabled = true;
        renderInventoryList();
    });
}

/* ==============================================================
   SCANNER
   ============================================================== */
document.getElementById('scanBtn').addEventListener('click', () => {
    const mode = document.querySelector('input[name="scanMode"]:checked').value;
    if (scanning) { codeReader.reset(); scanning = false; document.getElementById('video').style.display='none'; return; }

    scanning = true;
    const video = document.getElementById('video');
    video.style.display = 'block';

    codeReader.decodeFromVideoDevice(undefined, video, (result, err) => {
        if (result) {
            document.getElementById('barcodeInput').value = result.getText();
            if (mode === 'single') { stopScanner(); }
        }
    });
});
function stopScanner() {
    codeReader.reset();
    scanning = false;
    document.getElementById('video').style.display='none';
}

/* ==============================================================
   ADICIONAR ITEM
   ============================================================== */
document.getElementById('addItemBtn').addEventListener('click', addInventoryItem);
document.getElementById('barcodeInput').addEventListener('keypress', e => { if(e.key==='Enter') addInventoryItem(); });

function addInventoryItem() {
    const salaId = document.getElementById('selectSala').value;
    const objId  = document.getElementById('selectObjeto').value;
    const codigo = document.getElementById('barcodeInput').value.trim();

    if (!salaId || !objId || !codigo) return alert('Preencha sala, objeto e código');

    // procura sala no inventario
    let salaInv = data.inventário[0].inventario.find(s => s.salaId === salaId);
    if (!salaInv) {
        salaInv = {salaId, objetos:[]};
        data.inventário[0].inventario.push(salaInv);
    }

    // verifica se código já existe com outro objeto
    const outroObj = data.inventário[0].inventario
        .flatMap(s => s.objetos)
        .find(o => o.codigoBarra === codigo && o.objetoId !== objId);

    if (outroObj && !confirm(`Código ${codigo} já usado por outro tipo de objeto. Continuar?`)) return;

    // procura mesmo código + mesmo objeto na mesma sala
    const existente = salaInv.objetos.find(o => o.codigoBarra === codigo && o.objetoId === objId);
    if (existente) {
        existente.contador++;
    } else {
        const now = new Date().toISOString().slice(0,19).replace('T',' ');
        const objDesc = data.inventário[0].objetos.find(o=>o.id===objId).descricao;
        salaInv.objetos.push({
            objetoId: objId,
            codigoBarra: codigo,
            dataHora: now,
            contador: 1,
            descricao: objDesc   // para exibição
        });
    }

    saveData();
    renderInventoryList();
    document.getElementById('barcodeInput').value = '';
    if (document.querySelector('input[name="scanMode"]:checked').value === 'loop') {
        // mantém scanner ativo
    } else {
        stopScanner();
    }
}

/* ==============================================================
   LISTA DE ITENS
   ============================================================== */
function renderInventoryList() {
    const salaId = document.getElementById('selectSala').value;
    if (!salaId) { document.getElementById('inventoryList').innerHTML=''; return; }

    const salaInv = data.inventário[0].inventario.find(s => s.salaId === salaId);
    const div = document.getElementById('inventoryList');
    div.innerHTML = '';

    if (!salaInv || salaInv.objetos.length===0) {
        div.innerHTML = '<i>Nenhum item registrado.</i>';
        return;
    }

    salaInv.objetos.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.textContent = `${item.codigoBarra} – ${item.descricao} (contador: ${item.contador})`;
        el.onclick = () => {
            document.querySelectorAll('.item').forEach(e=>e.classList.remove('selected'));
            el.classList.add('selected');
            selectedItemIndex = idx;
            document.getElementById('removeItemBtn').disabled = false;
            document.getElementById('barcodeInput').value = item.codigoBarra;
        };
        div.appendChild(el);
    });
}

/* ==============================================================
   REMOVER ITEM SELECIONADO
   ============================================================== */
document.getElementById('removeItemBtn').addEventListener('click', () => {
    const salaId = document.getElementById('selectSala').value;
    if (selectedItemIndex === -1) return;

    const salaInv = data.inventário[0].inventario.find(s => s.salaId === salaId);
    const item = salaInv.objetos[selectedItemIndex];

    if (item.contador > 1 && !confirm(`Contador = ${item.contador}. Remover mesmo assim?`)) return;

    salaInv.objetos.splice(selectedItemIndex,1);
    if (salaInv.objetos.length===0) {
        const idx = data.inventário[0].inventario.findIndex(s=>s.salaId===salaId);
        data.inventário[0].inventario.splice(idx,1);
    }
    saveData();
    selectedItemIndex = -1;
    document.getElementById('removeItemBtn').disabled = true;
    renderInventoryList();
});

/* ==============================================================
   LIMPAR TODA A SALA
   ============================================================== */
document.getElementById('clearSalaBtn').addEventListener('click', () => {
    const salaId = document.getElementById('selectSala').value;
    if (!salaId) return;
    if (!confirm('Limpar TODOS os itens desta sala?')) return;

    const idx = data.inventário[0].inventario.findIndex(s=>s.salaId===salaId);
    if (idx!==-1) data.inventário[0].inventario.splice(idx,1);
    saveData();
    renderInventoryList();
});

/* ==============================================================
   ENVIAR PARA GOOGLE SHEETS (usando API Key)
   ============================================================== */
document.getElementById('sendToSheetBtn').addEventListener('click', () => {
    const unidade = data.inventário[0].unidade;
    const spreadsheetId = unidade.spreadsheetId;
    const apiKey = unidade.apiKey;
    const sheetName = unidade.sheetName || 'Sheet1'; // aba padrão

    if (!spreadsheetId || !apiKey) {
        return alert('Configure Spreadsheet ID, API Key e Nome da Aba na aba Unidade');
    }

    // Preparar linhas para append (cada item vira uma linha: [sala, codigo, tipo, contador, dataHora])
    const rows = [];
    data.inventário[0].inventario.forEach(sala => {
        sala.objetos.forEach(item => {
            rows.push([
                sala.salaId,
                item.codigoBarra,
                item.objetoId,
                item.contador,
                item.dataHora
            ]);
        });
    });

    if (rows.length === 0) {
        return alert('Nenhum item para enviar');
    }

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}:append?valueInputOption=RAW&key=${apiKey}`;

    const payload = {
        values: rows
    };

    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (response.ok) {
            alert('Dados enviados com sucesso para o Google Sheets!');
        } else {
            response.json().then(err => console.error(err));
            alert('Erro ao enviar: Verifique a API Key, Spreadsheet ID e permissões');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Erro de conexão');
    });
});

/* ==============================================================
   INICIALIZAÇÃO
   ============================================================== */
loadData();
document.querySelector('.tab-btn').click(); // abre a primeira aba
</script>
</body>
</html>
